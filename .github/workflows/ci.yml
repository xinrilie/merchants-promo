name: Engine checks

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install runtime and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest
      - name: Compile engine
        run: python -m compileall -q engine
      - name: Run name normalizer self-test
        run: python engine/promo_names.py
      - name: Run collector self-test
        run: python engine/promo_multisource_collector.py --self-test
      - name: Run duplicate and merge safeguards
        run: python engine/test_duplicate_fixes.py
      - name: Run regression tests
        run: python -m pytest -q
